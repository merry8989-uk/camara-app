name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner ships with the Android SDK and cmdline-tools already
      # installed, so we install the specific packages we need directly rather
      # than using a setup action (which can reference packages that no longer
      # exist, e.g. the removed "tools" package).
      - name: Install Android SDK packages
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;34.0.0"

      # The Gradle wrapper is committed via the GitHub API, which does not carry
      # the executable bit, so set it before invoking the wrapper.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # The signing keystore is NOT in the repository. It is stored as a base64
      # repository secret and decoded here, so the key stays private while every
      # build still carries the same certificate (so updates install in place).
      - name: Decode signing keystore from secrets
        run: |
          set -e
          if [ -z "${{ secrets.CAMARA_KEYSTORE_BASE64 }}" ]; then
            echo "::error::CAMARA_KEYSTORE_BASE64 is not set — add the signing secrets."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "${{ secrets.CAMARA_KEYSTORE_BASE64 }}" | base64 -d > keystore/camara-dev.p12
          ls -l keystore/camara-dev.p12

      - name: Build signed release APK
        env:
          CAMARA_KEYSTORE: keystore/camara-dev.p12
          CAMARA_KEY_ALIAS: camara
          CAMARA_STORE_PASSWORD: ${{ secrets.CAMARA_STORE_PASSWORD }}
          CAMARA_KEY_PASSWORD: ${{ secrets.CAMARA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify signing certificate
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          ls -l "$APK"
          # v1 signing is enabled, so the signing cert is readable from META-INF.
          unzip -l "$APK" | grep -i 'META-INF/.*\.RSA' || (echo 'No v1 signature found'; exit 1)
          CERT=$(unzip -p "$APK" 'META-INF/*.RSA' | sha256sum | cut -d' ' -f1)
          echo "META-INF signature blob sha256: $CERT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: camara-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
