name: Android CI

on:
  push:
    branches: [ main ]
    # A version tag publishes automatically (App Factory Rule 3).
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner ships with the Android SDK and cmdline-tools already
      # installed, so we install the specific packages we need directly rather
      # than using a setup action (which can reference packages that no longer
      # exist, e.g. the removed "tools" package).
      - name: Install Android SDK packages
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;34.0.0"

      # The Gradle wrapper is committed via the GitHub API, which does not carry
      # the executable bit, so set it before invoking the wrapper.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Unit tests cover the colour-matrix engine (the core of every filter, the strength
      # slider and the beauty grade) and the filter catalogue's integrity.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # The signing keystore is NOT in the repository. It is stored as a base64
      # repository secret and decoded here, so the key stays private while every
      # build still carries the same certificate (so updates install in place).
      - name: Decode signing keystore from secrets
        run: |
          set -e
          if [ -z "${{ secrets.CAMARA_KEYSTORE_BASE64 }}" ]; then
            echo "::error::CAMARA_KEYSTORE_BASE64 is not set — add the signing secrets."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "${{ secrets.CAMARA_KEYSTORE_BASE64 }}" | base64 -d > keystore/camara-dev.p12
          ls -l keystore/camara-dev.p12

      - name: Build signed release APK
        env:
          # Absolute path on purpose: a relative one would resolve against the app
          # module directory, not the repo root.
          CAMARA_KEYSTORE: ${{ github.workspace }}/keystore/camara-dev.p12
          CAMARA_KEY_ALIAS: camara
          CAMARA_REQUIRE_SIGNING: 'true'
          CAMARA_STORE_PASSWORD: ${{ secrets.CAMARA_STORE_PASSWORD }}
          CAMARA_KEY_PASSWORD: ${{ secrets.CAMARA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # Upload first, so the APK is always retrievable even if the check below fails.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: camara-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Verify signing certificate
        run: |
          set -e
          ls -l app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/app-release.apk 2>/dev/null \
                || ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          if ! unzip -l "$APK" | grep -qiE 'META-INF/.*\.(RSA|DSA|EC|SF)'; then
            echo "::error::APK has no v1 signature — it is unsigned or signing failed."
            exit 1
          fi
          echo "v1 signature present."
          unzip -p "$APK" 'META-INF/*.RSA' | sha256sum | cut -d' ' -f1

  # App Factory Rule 3: publishing is automatic. On a version tag this attaches the signed
  # APK built above to a GitHub Release. It only runs when the build and the signature
  # check both passed, so a broken build is never published.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: camara-release-apk
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          ls -l dist

          # A release may already exist: created as a draft so the notes can be written by
          # hand. In that case attach the APK and publish it, rather than leaving the
          # draft without an asset.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — attaching the APK."
            gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = "true" ]; then
              echo "Publishing the draft."
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            fi
            exit 0
          fi

          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Camara $TAG" \
            --generate-notes \
            --latest
